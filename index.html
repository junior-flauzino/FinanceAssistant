<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Financeiro" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <title>Controle Financeiro</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== Tela de PIN ===== -->
  <div id="pin-screen" class="pin-screen">
    <div class="pin-box">
      <div class="pin-logo">R$</div>
      <h1 id="pin-title">Digite seu PIN</h1>
      <p id="pin-subtitle" class="pin-subtitle">Acesse seu controle financeiro</p>

      <div class="pin-dots" id="pin-dots">
        <span></span><span></span><span></span><span></span>
      </div>

      <p id="pin-error" class="pin-error"></p>

      <div class="keypad" id="keypad">
        <button data-key="1">1</button>
        <button data-key="2">2</button>
        <button data-key="3">3</button>
        <button data-key="4">4</button>
        <button data-key="5">5</button>
        <button data-key="6">6</button>
        <button data-key="7">7</button>
        <button data-key="8">8</button>
        <button data-key="9">9</button>
        <button class="keypad-empty" disabled></button>
        <button data-key="0">0</button>
        <button data-key="del" class="keypad-del">⌫</button>
      </div>
    </div>
  </div>

  <!-- ===== App ===== -->
  <div id="app" class="app hidden">

    <header class="topbar">
      <div>
        <div class="topbar-title">Controle Financeiro</div>
        <div class="topbar-sub" id="month-label"></div>
      </div>
      <button id="btn-lock" class="icon-btn" title="Bloquear">🔒</button>
    </header>

    <!-- Filtro de mês -->
    <div class="month-nav">
      <button id="prev-month" class="month-arrow">‹</button>
      <span id="current-month"></span>
      <button id="next-month" class="month-arrow">›</button>
    </div>

    <!-- Dashboard -->
    <section class="cards">
      <div class="card card-balance">
        <span class="card-label">Saldo do mês</span>
        <span class="card-value" id="balance">R$ 0,00</span>
      </div>
      <div class="cards-row">
        <div class="card card-in">
          <span class="card-label">Receitas</span>
          <span class="card-value" id="income">R$ 0,00</span>
        </div>
        <div class="card card-out">
          <span class="card-label">Despesas</span>
          <span class="card-value" id="expense">R$ 0,00</span>
        </div>
      </div>
    </section>

    <!-- Gasto por categoria -->
    <section class="by-category" id="by-category-wrap">
      <h2 class="section-title">Despesas por categoria</h2>
      <div id="by-category"></div>
    </section>

    <!-- Lista de lançamentos -->
    <section class="list-section">
      <div class="list-header">
        <h2 class="section-title">Lançamentos</h2>
        <select id="filter-type" class="filter-select">
          <option value="all">Todos</option>
          <option value="income">Receitas</option>
          <option value="expense">Despesas</option>
        </select>
      </div>
      <div id="tx-list" class="tx-list"></div>
      <p id="empty-state" class="empty-state">Nenhum lançamento neste mês. Toque no + para adicionar.</p>
    </section>

    <!-- Botão flutuante -->
    <button id="fab" class="fab" title="Novo lançamento">+</button>

    <!-- Menu de backup -->
    <div class="footer-actions">
      <button id="btn-export" class="ghost-btn">Exportar backup</button>
      <button id="btn-import" class="ghost-btn">Importar backup</button>
      <input type="file" id="import-file" accept="application/json" hidden />
    </div>

    <p class="version-tag" id="version-tag">v1.0.0</p>
  </div>

  <!-- ===== Modal de lançamento ===== -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Novo lançamento</h2>
        <button id="modal-close" class="icon-btn">✕</button>
      </div>

      <form id="tx-form">
        <input type="hidden" id="tx-id" />

        <div class="type-toggle">
          <button type="button" class="type-btn active" data-type="expense" id="btn-expense">Despesa</button>
          <button type="button" class="type-btn" data-type="income" id="btn-income">Receita</button>
        </div>

        <label>Valor (R$)</label>
        <input type="text" id="tx-amount" inputmode="decimal" placeholder="0,00" autocomplete="off" required />

        <label>Descrição</label>
        <input type="text" id="tx-desc" placeholder="Ex: Mercado, Salário..." autocomplete="off" required />

        <label>Categoria</label>
        <select id="tx-category"></select>

        <label>Data</label>
        <input type="date" id="tx-date" required />

        <div class="modal-actions">
          <button type="button" id="btn-delete" class="delete-btn hidden">Excluir</button>
          <button type="submit" class="save-btn">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
